name: Windows 빌드 및 테스트

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 프린터 목록 (참고용)
        shell: powershell
        run: Get-Printer | Format-Table Name, DriverName -AutoSize

      - name: 테스트 (실제 Windows 인쇄 경로 포함)
        run: python -m pytest -v -rs

      - name: exe 빌드
        run: pyinstaller --noconfirm --clean --onefile --windowed --name EasyPrint main.py

      - name: exe 자체 점검
        shell: powershell
        run: |
          $p = Start-Process -FilePath dist\EasyPrint.exe -ArgumentList '--selftest','selftest.json' -PassThru
          if (-not $p.WaitForExit(120000)) {
            Get-Process | Where-Object { $_.Path -like '*EasyPrint*' } | Format-Table Id, ProcessName, MainWindowTitle -AutoSize
            Get-Process | Where-Object { $_.Path -like '*EasyPrint*' } | Stop-Process -Force
            Write-Error "selftest 가 2분 안에 끝나지 않음 (오류 대화상자가 떠 있을 가능성)"; exit 1
          }
          Get-Content selftest.json -Encoding UTF8
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: 배포 파일 묶기
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\EasyPrint.exe release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath EasyPrint-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: EasyPrint-windows
          path: EasyPrint-windows.zip

      # 자동 업데이트용 릴리스: easyprint/__init__.py 의 __version__ 을 올려서 푸시하면 새 릴리스가 생기고,
      # 사용자 PC 의 간편출력이 이를 감지해 자동으로 설치한다. (같은 버전이면 아무것도 하지 않음)
      - name: 새 버전이면 릴리스 생성 (자동 업데이트 배포)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/easy-print-program-5whsdf')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import easyprint; print(easyprint.__version__)")
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "v$VER 릴리스가 이미 있어 건너뜀 (배포하려면 __version__ 을 올리세요)"
            exit 0
          fi
          python -c "import hashlib,sys; print(hashlib.sha256(open('dist/EasyPrint.exe','rb').read()).hexdigest())" > EasyPrint.exe.sha256
          cat EasyPrint.exe.sha256
          git log -1 --pretty=%B > notes.txt
          gh release create "v$VER" dist/EasyPrint.exe EasyPrint.exe.sha256 EasyPrint-windows.zip \
            --target "$GITHUB_SHA" --title "간편출력 v$VER" --notes-file notes.txt

      - name: 배포된 릴리스로 자동 업데이트 실제 검증 (다운로드 + 해시 + 교체)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/easy-print-program-5whsdf')
        shell: bash
        run: |
          mkdir -p upd && printf 'old build' > upd/EasyPrint.exe
          python - <<'PY'
          from pathlib import Path
          from easyprint import updater
          exe = Path("upd/EasyPrint.exe")
          ver = updater.update_now(exe, current="0")
          assert ver, "최신 릴리스를 찾지 못함"
          size = exe.stat().st_size
          assert size > 1_000_000 and exe.read_bytes()[:2] == b"MZ", size
          print(f"OK: v{ver} 내려받아 교체 완료 ({size:,} bytes, SHA-256 검증 통과)")
          PY
          timeout 120 ./upd/EasyPrint.exe --selftest upd/selftest.json || echo "selftest 종료코드 $?"
          sleep 5; cat upd/selftest.json || true
